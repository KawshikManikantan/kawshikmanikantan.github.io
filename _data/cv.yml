- title: Research Experience
  type: time_table
  contents:
    - title: Pre-Doctoral Researcher
      institution: Google DeepMind, Languages Group
      location: Bengaluru, India
      year: 2025 – now
      description:
        - Developing agentic training methods for efficient deep visual search over long videos.
        - Post-training Gemini to improve video reasoning across multilingual and multicultural contexts; co-authored the MINERVA-Cultural benchmark (CVPR 2026, Highlight).
        - White-box analysis of cross-lingual factual retrieval in Gemini.
    - title: Research Fellow Intern
      institution: Advanced Micro Devices (AMD), AI Group
      location: Bengaluru, India
      year: 2024 – 2025
      description:
        - Improved continual model-editing generalization accuracy by ~15% through multi-faceted data augmentation.
        - Built a continually updated, large-scale benchmark of recent Wikipedia edits to measure how well edited models adapt to new facts.
    - title: Undergraduate Researcher
      institution: Center for Visual Information Technology (CVIT), IIITH
      location: Hyderabad, India
      year: 2021 – 2025
      description:
        - Proposed Major Entity Identification (MEI), a generalizable alternative to coreference resolution that transfers across domains and enables LLM evaluation (EMNLP 2024).
        - Built IdentifyMe, a long-context mention-resolution benchmark for frontier LLMs (NAACL 2025, Oral).
        - Re-implemented <a href="https://arxiv.org/abs/1604.01802"><i>Tracking at 100 FPS</i></a> (GOTURN) and the <a href="https://arxiv.org/abs/1912.07515"><i>neural MOT solver</i></a> (MPNTrack), extending graph-based tracking to multi-view detection and tracking in long sports videos with Star Sports (<a href="https://github.com/KawshikManikantan/Tracking_CV">code</a>).
    - title: Research Intern
      institution: Star Sports
      location: Remote, India
      year: 2022
      description:
        - Built and deployed an operator-free player-tracking system used live during the Asia Cup 2022 broadcasts.
        - Drove ideation and feature development for player segregation, and built the pre-deployment pipeline.

