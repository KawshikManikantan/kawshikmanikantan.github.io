      maindescription: "Compared Bag-of-Words, LSTM, and DIIN models for natural language inference; implemented character-level convolutional (CREPE) and attention-based (CANINE) text classifiers; multi-class classification of mental-health disorders from Reddit posts with CNN, Random Forest, SVM, XGBoost, and DistilBERT. PyTorch Lightning, Keras, NLTK."
      linkitems:
