          link: https://github.com/tgv2002/IRE-Project-Team-7
    - title: SimpleRA DBMS
      maindescription: "Relational DBMS with integer tables and matrix operations: two-phase on-disk merge sort, delayed-write buffer manager, linear-hash and B+-tree indexes. C++."
      linkitems:
        - linkname: github
          link: https://github.com/KawshikManikantan/SimpleRA
    - title: Wikipedia Search Engine
      maindescription: "Search engine over a full Wikipedia dump, built from scratch: field-aware inverted index (title, infobox, body, categories, links, references) built by external k-way merging of partial indexes, with stemming, stop-word filtering, and field-restricted queries. Python, NLTK."
      linkitems:
        - linkname: github
          link: https://github.com/KawshikManikantan/Wiki_Retrieval_System
    - title: Linux Mini Shell
      maindescription: "Shell with piping, redirection, background processes, and common built-ins, implemented directly on POSIX system calls. C."
